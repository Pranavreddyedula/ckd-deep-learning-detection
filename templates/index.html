<!DOCTYPE html>
<html>
<head>
    <title>CKD Prediction</title>
    <style>
        body {
            font-family: Arial;
            background-color: #f4f6f9;
            text-align: center;
        }

        h1 {
            margin-top: 20px;
        }

        form {
            background: white;
            padding: 30px;
            width: 60%;
            margin: auto;
            border-radius: 10px;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.1);
        }

        input {
            width: 80%;
            padding: 10px;
            margin: 5px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        button {
            padding: 12px 25px;
            background-color: #2f80ed;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1c60c9;
        }
    </style>
</head>
<body>

<h1>🧠 Chronic Kidney Disease Prediction</h1>

<form action="/predict" method="post">

{% for col in [
"age","bp","sg","al","su","rbc","pc","pcc","ba","bgr",
"bu","sc","sod","pot","hemo","pcv","wc","rc",
"htn","dm","cad","appet","pe","ane"
] %}
<input type="text" name="{{ col }}" placeholder="{{ col | upper }}" required><br>
{% endfor %}

<br>
<button type="submit">🔍 Predict</button>

</form>

</body>
</html>
